name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --workspace --locked
      - name: Host examples (they assert their own output)
        run: |
          for example in host_text host_build_check host_curve host_threads; do
            cargo run --locked -q -p lamlet --example "$example" > /dev/null
          done
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: The lamlet library has no dependencies
        run: |
          deps=$(cargo tree -p lamlet --edges normal,build --prefix none | tail -n +2)
          if [ -n "$deps" ]; then echo "lamlet must not depend on:"; echo "$deps"; exit 1; fi
